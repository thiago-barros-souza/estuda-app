name: estuda_app
description: "App de simulados para concursos públicos — Técnico de Enfermagem, SES/SECAD-TO (banca FGV)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Persistência local do histórico de desempenho (equivalente ao localStorage
  # usado na versão web deste app).
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
